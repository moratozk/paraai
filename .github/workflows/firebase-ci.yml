name: Verificação ESP e Firebase

on:
  pull_request:
    branches: [main]
    paths:
      - 'Main/**'
      - 'firestore.rules'
      - 'firebase.test.json'
      - '.github/workflows/firebase-ci.yml'
  push:
    branches: [main]
    paths:
      - 'Main/**'
      - 'firestore.rules'
      - 'firebase.test.json'
      - '.github/workflows/firebase-ci.yml'

permissions:
  contents: read

concurrency:
  group: firebase-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firestore-tests:
    name: Contratos e isolamento no emulador
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Main/tests
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
      - name: Preparar Adafruit GFX 1.12.6 para os testes
        uses: actions/checkout@v5
        with:
          repository: adafruit/Adafruit-GFX-Library
          ref: ac6d7c3869a693d406f77b9bfcd486b0673169f0
          path: libraries/Adafruit_GFX_Library
          persist-credentials: false
      - name: Preparar Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Main/tests/package-lock.json
      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependências de teste
        run: npm ci --ignore-scripts
      - name: Testar lógica C++ compartilhada com o firmware
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror logica_totem.test.cpp -o /tmp/paraai-logica-test
          /tmp/paraai-logica-test
      - name: Testar interface real com periféricos simulados
        run: |
          g++ -std=c++17 -DARDUINO=100 -Ihost -I../../libraries/Adafruit_GFX_Library ui_totem.test.cpp ../../libraries/Adafruit_GFX_Library/Adafruit_GFX.cpp -o /tmp/paraai-ui-test
          /tmp/paraai-ui-test .runtime/preview
      - name: Guardar telas renderizadas para revisão
        uses: actions/upload-artifact@v4
        with:
          name: telas-totem
          path: Main/tests/.runtime/preview/*.svg
      - name: Validar regras e operações sem produção
        run: npm test

  firmware-build:
    # Os testes acima rodam no PC; este job compila o .ino de verdade, como a
    # AGENTS.md exige, usando o modelo de credenciais (sem segredo nenhum).
    name: Compilação do firmware (ESP32 Dev Module, Huge APP)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - name: Baixar código
        uses: actions/checkout@v5
      - name: Conferir que RaizesGoogle.h valida o Firestore
        run: |
          sed -n '/BEGIN CERTIFICATE/,/END CERTIFICATE/p' Main/RaizesGoogle.h > /tmp/raizes.pem
          echo | openssl s_client -connect firestore.googleapis.com:443 \
            -servername firestore.googleapis.com -CAfile /tmp/raizes.pem -verify_return_error 2>&1 \
            | grep -q 'Verify return code: 0 (ok)'
      - name: Preparar arduino-cli
        uses: arduino/setup-arduino-cli@v2
      - name: Reaproveitar core ESP32 e bibliotecas
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-esp32-3.3.10-firebase-4.4.17-v1
      - name: Instalar core e bibliotecas nas versões usadas no projeto
        run: |
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@3.3.10
          arduino-cli lib install --no-deps \
            "Firebase Arduino Client Library for ESP8266 and ESP32@4.4.17" \
            "Adafruit ILI9341@1.6.3" "Adafruit GFX Library@1.12.6" \
            "Adafruit BusIO@1.17.4" "XPT2046_Touchscreen@1.4"
      - name: Compilar com o modelo de credenciais
        run: |
          cp Main/Credenciais.example.h Main/Credenciais.h
          arduino-cli compile --fqbn esp32:esp32:esp32:PartitionScheme=huge_app --warnings default Main
