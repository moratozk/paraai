<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#0a0c11" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ParaAí — Tecnologia para estacionamentos</title>
    <meta
      name="description"
      content="ParaAí liga motoristas e estacionamentos: vagas livres ao vivo, entrada e saída pelo totem com a placa do carro e a estadia calculada pelo tempo exato."
    />
    <!-- Prévia do link no WhatsApp, nas redes e nos buscadores. A imagem é a
         página inicial em 1200x630, sem o menu e os botões (ver ESTADO.md). -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ParaAí" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:url" content="https://paraai.web.app/" />
    <meta property="og:title" content="ParaAí — Digite a placa. Estacione. Vá embora." />
    <meta
      property="og:description"
      content="Vagas livres ao vivo, entrada e saída pelo totem com a placa do carro e a estadia calculada pelo tempo exato."
    />
    <meta property="og:image" content="https://paraai.web.app/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Página inicial do ParaAí: Digite a placa. Estacione. Vá embora. Ao lado, um estacionamento visto de cima com a vaga indicada."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- App instalável: manifesto, ícone do iPhone e nome curto na tela inicial. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="ParaAí" />
    <script>
      // Tema salvo aplicado antes do primeiro quadro, para quem usa o claro não
      // ver o escuro piscar enquanto o site carrega (ver ThemeContext).
      try {
        if (localStorage.getItem("para-ai-theme") === "light") {
          document.documentElement.setAttribute("data-theme", "light");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#e9e7e3");
        }
      } catch {
        // Sem armazenamento, fica o escuro, que é o padrão.
      }
      // Aberto pela tela inicial do iPhone: a barra do topo desce um pouco
      // (--respiro-app, no index.css).
      if (window.navigator.standalone === true) {
        document.documentElement.classList.add("app-instalado");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
